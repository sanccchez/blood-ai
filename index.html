<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood.AI — Visual Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px); background-size: 30px 30px; }
        .brand-logo { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.05); }
        
        /* ШКАЛЫ ЗДОРОВЬЯ (Новые стили) */
        .scale-bg { background: #e2e8f0; height: 8px; border-radius: 4px; width: 100%; position: relative; overflow: hidden; margin-top: 6px; }
        .scale-fill { height: 100%; background: linear-gradient(90deg, #ef4444, #dc2626); border-radius: 4px; width: 0%; animation: fillBar 1.5s ease-out forwards; }
        @keyframes fillBar { from { width: 0%; } to { width: 85%; } }
        
        /* Анимация пульсации */
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(2); opacity: 0; } }
        .pulse-ring::before { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; border-radius: 50%; border: 2px solid #ef4444; animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center py-12 px-4">

    <header class="w-full max-w-3xl flex justify-between items-center mb-12">
        <div class="flex items-center gap-4 cursor-pointer" onclick="location.reload()">
            <div class="brand-logo w-12 h-12 rounded-xl flex items-center justify-center text-white text-xl font-bold">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900">Blood.AI</h1>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-widest">Version 3.1 (Visual)</p>
            </div>
        </div>
        <button onclick="toggleQRModal()" class="w-10 h-10 rounded-full bg-white shadow-sm border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-900 transition-colors">
            <i class="fa-solid fa-qrcode"></i>
        </button>
    </header>

    <main class="w-full max-w-3xl relative">
        
        <div id="promo-section" class="text-center py-10">
            <h2 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-6 leading-tight">
                Расшифровка анализов <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-600">v3.1 Визуализация</span>
            </h2>
            <p class="text-lg text-slate-500 mb-10 max-w-lg mx-auto leading-relaxed">
                Загрузите фото. Нейросеть построит графики отклонений и даст рекомендации.
            </p>
            <button onclick="showUploadSection()" class="bg-slate-900 text-white px-8 py-4 rounded-full font-bold text-lg shadow-xl hover:bg-slate-800 transition transform hover:-translate-y-1 flex items-center gap-3 mx-auto">
                <i class="fa-solid fa-upload"></i>
                Загрузить анализ
            </button>
        </div>

        <div id="upload-section" class="glass-panel rounded-3xl p-8 hidden relative overflow-hidden">
            <div id="drop-zone" class="border-2 border-dashed border-slate-200 hover:border-red-400 hover:bg-red-50/30 transition-all rounded-2xl p-12 text-center cursor-pointer min-h-[300px] flex flex-col items-center justify-center group">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-300 group-hover:text-red-500 mb-4 transition-colors"></i>
                <h3 class="text-xl font-bold text-slate-800">Нажмите для загрузки</h3>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*,application/pdf">

            <div id="loading" class="hidden absolute inset-0 bg-white/95 z-10 flex flex-col items-center justify-center text-center backdrop-blur-sm">
                <div class="relative w-24 h-24 mb-6 pulse-ring flex items-center justify-center">
                    <div class="w-16 h-16 bg-gradient-to-tr from-red-500 to-orange-600 rounded-full shadow-lg flex items-center justify-center text-white text-2xl">
                        <i class="fa-solid fa-microscope fa-spin-pulse"></i>
                    </div>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Анализ показателей...</h3>
                <p id="loading-text" class="text-sm text-slate-500 font-mono">Соединение...</p>
            </div>
        </div>

        <div id="results-section" class="hidden space-y-6">
            
            <div class="glass-panel rounded-3xl p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 text-xl">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                    <div>
                        <h2 id="client-fio" class="font-bold text-lg text-slate-900">...</h2>
                        <div class="flex gap-3 text-xs font-bold text-slate-400 uppercase tracking-widest">
                            <span id="client-gender"></span> • <span id="client-age"></span>
                        </div>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">ДАТА</p>
                    <p id="analysis-date" class="font-mono text-lg font-bold text-slate-800">...</p>
                </div>
            </div>

            <div class="glass-panel rounded-3xl overflow-hidden shadow-lg border-0">
                <div class="bg-slate-50/50 px-8 py-4 border-b border-slate-100 flex justify-between items-center backdrop-blur">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-chart-simple text-red-500"></i>
                        Отклонения
                    </h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <tbody id="results-body">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="glass-panel rounded-3xl p-8 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-slate-900"></div>
                <h3 class="font-bold text-slate-900 mb-4">Заключение AI</h3>
                <p id="expert-summary" class="text-slate-600 leading-relaxed mb-6 text-sm"></p>
                <div class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold uppercase tracking-wider inline-block">
                    <i class="fa-solid fa-user-doctor mr-1"></i> <span id="priority-action"></span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="playSummaryVoice()" class="p-4 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 font-bold text-slate-700 text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-volume-high text-slate-400"></i> Слушать
                </button>
                <button onclick="generateDietPlan()" class="p-4 rounded-2xl bg-white border border-slate-200 hover:bg-green-50 hover:text-green-700 hover:border-green-200 font-bold text-slate-700 text-sm flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-apple-whole text-green-500"></i> Диета
                </button>
            </div>

            <div id="diet-plan-container" class="hidden glass-panel rounded-3xl p-8 border-l-4 border-green-500">
                <div id="diet-plan-content" class="text-slate-600 text-sm leading-relaxed"></div>
            </div>

            <div class="glass-panel rounded-3xl p-4 bg-slate-900 text-white mt-8">
                <div id="ai-answer" class="hidden p-4 bg-white/10 rounded-xl mb-4 text-sm text-slate-200"></div>
                <div class="flex gap-2">
                    <input id="ai-question" type="text" placeholder="Вопрос..." disabled class="w-full bg-slate-800 px-4 py-3 rounded-xl text-sm outline-none">
                    <button id="ask-btn" onclick="askAI()" disabled class="bg-red-600 w-12 rounded-xl flex items-center justify-center hover:bg-red-500"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-12 text-center pb-8 opacity-40">
        <div id="footer-qrcode" class="flex justify-center mb-4 mix-blend-multiply"></div>
        <p class="text-[10px] text-slate-500 font-mono tracking-widest uppercase">Blood.AI v3.1</p>
    </footer>

    <div id="qr-modal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-50" onclick="toggleQRModal()">
        <div class="bg-white p-8 rounded-3xl text-center" onclick="event.stopPropagation()">
            <div id="modal-qrcode" class="flex justify-center"></div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://blood-ai-server.onrender.com"; 

        const promo=document.getElementById('promo-section'), upload=document.getElementById('upload-section'), resSec=document.getElementById('results-section');
        const fileInput=document.getElementById('file-input'), dropZone=document.getElementById('drop-zone');
        const loading=document.getElementById('loading'), loadingText=document.getElementById('loading-text');
        
        let currentAnalysisData = null;
        let wakeUpTimer = null;

        function showUploadSection(){ promo.classList.add('hidden'); upload.classList.remove('hidden'); }
        function toggleQRModal(){ 
            const m=document.getElementById('qr-modal'); 
            m.style.display=(m.style.display==='flex'?'none':'flex');
            if(m.style.display==='flex' && !document.getElementById('modal-qrcode').hasChildNodes()){
                 new QRCode(document.getElementById("modal-qrcode"), { text: window.location.href, width: 150, height: 150 });
            }
        }

        dropZone.onclick=()=>fileInput.click();
        fileInput.onchange=(e)=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };

        async function handleFile(file) {
            loading.classList.remove('hidden'); dropZone.classList.add('hidden');
            loadingText.innerText = "Связь с сервером...";
            wakeUpTimer = setTimeout(() => { loadingText.innerText = "Сервер просыпается... ~40 сек."; loadingText.className = "text-orange-500 font-mono text-xs animate-pulse"; }, 4000);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${SERVER_URL}/api/analyze`, { method: 'POST', body: formData });
                clearTimeout(wakeUpTimer);
                if (!response.ok) { const err = await response.json(); throw new Error(err.error || response.status); }
                currentAnalysisData = await response.json();
                displayResults(currentAnalysisData);
            } catch (error) {
                clearTimeout(wakeUpTimer);
                alert(error.message.includes("429") ? "✋ Лимит. Ждите 1 мин." : "Ошибка: " + error.message);
                dropZone.classList.remove('hidden'); loading.classList.add('hidden'); fileInput.value = '';
            }
        }

        function displayResults(data) {
            upload.classList.add('hidden'); resSec.classList.remove('hidden');
            const cl = data.client || {};
            document.getElementById('client-fio').innerText = cl.fio || "Пациент";
            document.getElementById('client-gender').innerText = cl.gender || "-";
            document.getElementById('client-age').innerText = cl.age || "-";
            document.getElementById('analysis-date').innerText = cl.date || "--.--.--";
            
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            
            const res = data.abnormal_results || [];
            if(res.length === 0) {
                 tbody.innerHTML = `<tr><td class="px-8 py-10 text-center text-green-600 font-bold bg-green-50/50">🎉 Норма!</td></tr>`;
            } else {
                res.forEach(item => {
                    // --- ГЕНЕРАЦИЯ ПОЛОСОК ---
                    tbody.innerHTML += `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-5 align-top w-1/3">
                            <div class="font-bold text-slate-800 text-sm">${item.name}</div>
                            <div class="text-[10px] text-slate-400 font-mono mt-1">Норма: ${item.range}</div>
                        </td>
                        <td class="px-6 py-5 align-top w-1/3">
                            <div class="flex flex-col gap-1">
                                <span class="font-black text-red-600 text-lg leading-none">${item.value}</span>
                                <div class="scale-bg"><div class="scale-fill"></div></div>
                            </div>
                        </td>
                        <td class="px-6 py-5 align-top text-xs text-slate-500 italic">${item.analysis}</td>
                    </tr>`;
                });
            }

            document.getElementById('expert-summary').innerText = data.expert_summary || "";
            document.getElementById('priority-action').innerText = data.priority_action || "Терапевт";
            
            document.getElementById('ai-question').disabled = false;
            document.getElementById('ask-btn').disabled = false;
            document.getElementById('diet-plan-container').classList.add('hidden');
        }

        async function generateDietPlan() {
            const c = document.getElementById('diet-plan-container'), t = document.getElementById('diet-plan-content');
            c.classList.remove('hidden'); t.innerText = "Генерация меню...";
            try {
                const r = await fetch(`${SERVER_URL}/api/diet`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({analysis_data: currentAnalysisData})});
                const d = await r.json(); t.innerHTML = d.diet_plan ? d.diet_plan.replace(/\n/g, '<br>') : "Нет данных";
            } catch(e) { t.innerText = "Ошибка"; }
        }

        async function playSummaryVoice() {
            try {
                const r = await fetch(`${SERVER_URL}/api/voice`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text: document.getElementById('expert-summary').innerText})});
                const b = await r.blob(); new Audio(URL.createObjectURL(b)).play();
            } catch(e) { alert("Ошибка"); }
        }

        async function askAI() {
            const i = document.getElementById('ai-question'), b = document.getElementById('ask-btn'), a = document.getElementById('ai-answer');
            if(!i.value.trim()) return;
            const old = b.innerHTML; b.innerHTML='...'; b.disabled=true; a.classList.remove('hidden'); a.innerText="Думаю...";
            try {
                const r = await fetch(`${SERVER_URL}/api/chat`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({question: i.value, analysis_data: currentAnalysisData})});
                const d = await r.json(); a.innerHTML = `<b>AI:</b> ${d.answer.replace(/\n/g, '<br>')}`;
            } catch(e) { a.innerText="Ошибка"; }
            b.innerHTML=old; b.disabled=false; i.value='';
        }
        
        window.onload = function() {
           if(document.getElementById("footer-qrcode")) new QRCode(document.getElementById("footer-qrcode"), { text: window.location.href, width: 80, height: 80 });
        };
    </script>
</body>
</html>
